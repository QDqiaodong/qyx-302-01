version: '3.8'

services:
  mysql:
    image: mysql:8.0
    ports:
      - "127.0.0.1:3388:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: review_system
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6461:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build: 
      context: ./backend
      args:
        - MAVEN_MIRROR=https://mirrors.163.com/maven/repository/maven-public/
    ports:
      - "127.0.0.1:8172:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: review_system
      DB_USER: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        - NPM_REGISTRY=https://mirrors.ustc.edu.cn/npm/
    ports:
      - "127.0.0.1:8162:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data: